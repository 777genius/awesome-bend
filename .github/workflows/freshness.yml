name: Version freshness

on:
  push:
    branches: [main]
    paths:
      - scripts/check_bendhub.py
      - scripts/check_freshness.py
      - tests/test_check_bendhub.py
      - tests/test_check_freshness.py
      - .github/workflows/freshness.yml
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the validators without network access
        run: python3 -m unittest discover -s tests -v
      - name: Fetch official Bend release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            fetch_status=0
            timeout --kill-after=5s 20s gh api repos/bendlang/bend/releases/latest > "$RUNNER_TEMP/bend-release.json" || fetch_status=$?
            case "$fetch_status" in
              0) exit 0 ;;
              1|124) ;;
              *)
                echo "::error::Bend release lookup could not run (exit $fetch_status). Inspect the fetch logs and runner configuration."
                exit "$fetch_status"
                ;;
            esac
            if [[ "$attempt" -lt 3 ]]; then
              sleep "$((attempt * 2))"
            fi
          done
          # Discard any partial response; the checker reports this as unavailable.
          echo "Bend release metadata is unavailable after retries; inspect the fetch logs and retry later."
          echo '{"_unavailable":true}' > "$RUNNER_TEMP/bend-release.json"
      - name: Report newer published versions
        run: |
          audit_status=0
          python3 scripts/check_freshness.py --bend-release "$RUNNER_TEMP/bend-release.json" || audit_status=$?
          if [[ "$audit_status" -eq 3 ]]; then
            echo "Freshness check is incomplete because a source is temporarily unavailable. Retry this audit later."
            exit 0
          fi
          exit "$audit_status"
